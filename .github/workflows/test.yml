name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash -n init_system.sh tests/test_uninstall.sh
      - run: shellcheck -x init_system.sh tests/test_uninstall.sh
      - run: bash tests/test_uninstall.sh
